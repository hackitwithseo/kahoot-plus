<!DOCTYPE html>
<html lang="en">
<head>

<title>Kahoot+</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0418;color:#fff;overscroll-behavior:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background-image:radial-gradient(120% 70% at 50% -10%,#54209f 0%,transparent 60%),radial-gradient(80% 55% at 100% 105%,#123b8a 0%,transparent 55%)}
button{font-family:inherit;border:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,select{font-family:inherit}
#app{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

.v{flex:1;min-height:0;display:none;flex-direction:column}
body[data-v="join"] #vJoin{display:flex}
body[data-v="game"] #vGame{display:flex}
#vJoin{overflow-y:auto;padding:22px 20px;-webkit-overflow-scrolling:touch}

.mk{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(150deg,#7b2ff7,#ff2e63);box-shadow:0 16px 34px rgba(123,47,247,.5)}
.mk svg{width:29px;height:29px}
.lg{font-size:clamp(28px,8vw,36px);font-weight:900;letter-spacing:-1.6px;line-height:1;background:linear-gradient(96deg,#fff 20%,#ffd400 55%,#22e0ff 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tg{font-size:10px;letter-spacing:3.4px;text-transform:uppercase;color:#9a86bd;font-weight:800;margin-top:-7px}
.glass{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.4)}

input,select{width:100%;background:rgba(0,0,0,.32);border:1.5px solid rgba(255,255,255,.14);border-radius:12px;padding:13px;font-size:16px;font-weight:700;color:#fff;outline:none;transition:border-color .15s}
select{font-weight:600;font-size:15px}

#pin{font-size:23px;letter-spacing:5px;text-align:center;font-variant-numeric:tabular-nums}
.btn{border-radius:12px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.09);color:#fff;width:100%;transition:transform .1s}

.btn.sm{padding:11px;font-size:13px}
.err{color:#ff90a8;font-size:12px;font-weight:700;text-align:center;min-height:14px}
.out{font-size:11.5px;font-weight:700;line-height:1.5;padding:9px 11px;border-radius:10px;display:none;word-break:break-word}
.out.on{display:block}
.out.ok{background:rgba(46,224,106,.14);color:#8dffb6;border:1px solid rgba(46,224,106,.3)}
.out.no{background:rgba(255,46,99,.14);color:#ffa8bd;border:1px solid rgba(255,46,99,.3)}
.out.wa{background:rgba(255,212,0,.13);color:#ffe680;border:1px solid rgba(255,212,0,.3)}
.sep{display:flex;align-items:center;gap:10px;width:100%;margin:3px 0}
.sep i{flex:1;height:1px;background:rgba(255,255,255,.12)}
.sep span{font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:#6f5c8f;font-weight:800}
.remrow{display:flex;align-items:center;gap:10px;padding-top:4px}
.remrow .t{flex:1;min-width:0}
.remrow .t b{display:block;font-size:13px}
.remrow .t small{display:block;font-size:10.5px;color:#9a86bd;margin-top:2px;line-height:1.4}
.sw{flex:0 0 48px;height:29px;border-radius:15px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .18s}
.sw.on{background:linear-gradient(96deg,#7b2ff7,#2ee06a)}
.sw.on::after{transform:translateX(19px)}
#vGame{overflow:hidden}
.bar{display:flex;align-items:center;gap:9px;padding:12px 14px}
.chip{font-size:12px;font-weight:800;letter-spacing:1.6px;padding:7px 11px;border-radius:9px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums}
.sc{margin-left:auto;font-size:12.5px;font-weight:800;color:#ffd400}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;cursor:pointer}
.ic svg{width:17px;height:17px}
.tb{height:5px;margin:0 14px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;flex:0 0 auto}
.tb i{display:block;height:100%;width:100%;background:#ffd400;transition:width .1s linear}
.tb.low i{background:#ff2e63}
.stp{display:none;margin:9px 14px 0;font-size:11px;font-weight:700;padding:7px 11px;border-radius:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp.on{display:block}
.stp.ok{background:rgba(46,224,106,.16);color:#8dffb6;border:1px solid rgba(46,224,106,.35)}
.stp.bad{background:rgba(255,46,99,.16);color:#ffa8bd;border:1px solid rgba(255,46,99,.35)}
.stp.wa{background:rgba(255,212,0,.14);color:#ffe680;border:1px solid rgba(255,212,0,.32)}
.stg{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.mt{font-size:10.5px;font-weight:800;color:#9a86bd;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px}

.op{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.o{position:relative;display:flex;align-items:center;gap:9px;border-radius:13px;padding:14px 11px;font-size:13.5px;font-weight:800;color:#fff;text-align:left;cursor:pointer;min-height:68px;overflow-wrap:anywhere;border:1.5px solid rgba(255,255,255,.16);transition:transform .09s}
.o:active{transform:scale(.97)}
.o[disabled]{cursor:default}
.o.c0{background:linear-gradient(160deg,#ff2e63,#c3103f)}
.o.c1{background:linear-gradient(160deg,#2f7dff,#0b46b8)}
.o.c2{background:linear-gradient(160deg,#ffb800,#c07d00)}
.o.c3{background:linear-gradient(160deg,#2ee06a,#128a3d)}
.o .s{flex:0 0 16px;height:16px;background:rgba(0,0,0,.3)}
.o.c0 .s{clip-path:polygon(50% 0,100% 100%,0 100%)}
.o.c1 .s{transform:rotate(45deg) scale(.8)}
.o.c2 .s{border-radius:50%}
.o.sel{border-color:#fff;filter:brightness(1.2)}
.o.hit{border-color:#ffd400;box-shadow:0 0 0 2.5px #ffd400,0 0 22px rgba(255,212,0,.5);animation:pp .5s ease-in-out 3}
.o.hit::after{content:"\2713";position:absolute;top:2px;right:6px;font-size:14px;font-weight:900;color:#ffd400}
.o.ai{border-color:#22e0ff;box-shadow:0 0 0 2.5px #22e0ff}
.o.ai::after{content:"AI";position:absolute;top:3px;right:5px;font-size:9px;font-weight:900;color:#22e0ff}
@keyframes pp{50%{filter:brightness(1.3)}}
.fr{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.fr .btn{background:linear-gradient(96deg,#7b2ff7,#ff2e63)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;padding:0;border:0;height:32px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:rgba(255,255,255,.2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:25px;height:25px;border-radius:50%;background:#ffd400;margin-top:-9px}
.ft{padding:8px 14px 11px;font-size:11px;color:rgba(255,255,255,.42);text-align:center;min-height:28px}
.dn{text-align:center;padding:30px 16px}

.pn{position:fixed;inset:0;z-index:50;background:#10061f;transform:translateY(120%);visibility:hidden;pointer-events:none;transition:transform .26s cubic-bezier(.2,.9,.3,1),visibility .26s;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
.pn.on{transform:translateY(0);visibility:visible;pointer-events:auto}

.ph{display:flex;align-items:center;margin-bottom:16px}
.ph h2{margin:0;font-size:19px;font-weight:900}

.sc2{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#22e0ff;font-weight:900;margin:20px 0 4px}
.sc2:first-of-type{margin-top:0}

.fd{padding:13px 0}

.rg{display:flex;align-items:center;gap:11px}

.sts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:10px}
.st{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:13px 9px;text-align:center}
.st b{display:block;font-size:20px;font-weight:900;color:#ffd400}
.st small{display:block;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:#9a86bd;margin-top:3px;font-weight:800}
.lg2{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.li{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-left:3px solid #2ee
